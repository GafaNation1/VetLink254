services:
  # --- Core API ---
  - type: web
    name: vetlink-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    buildCommand: ""
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    preDeployCommand: alembic upgrade head && python -m scripts.create_admin
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetlink-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vetlink-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: KVB_API_BASE_URL
        value: stub
      - key: KVB_CLIENT_ID
        sync: false
      - key: KVB_CLIENT_SECRET
        sync: false
      - key: KVB_CACHE_TTL_SECONDS
        value: "180"
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: BOARD_NOTIFICATION_PHONE
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: DOC_UPLOAD_MAX_MB
        value: "10"

  # --- USSD thin adapter ---
  - type: web
    name: vetlink-ussd
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/ussd/Dockerfile
    buildCommand: ""
    startCommand: gunicorn --bind 0.0.0.0:8001 app.main:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: vetlink-api
          property: url
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vetlink-redis
          property: connectionString
      - key: SESSION_TTL_SECONDS
        value: "180"

  # --- Public read-only verified-clinics dashboard ---
  - type: web
    name: vetlink-web
    runtime: static
    buildCommand: ""
    staticPublishPath: apps/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# --- Managed Postgres Database ---
databases:
  - name: vetlink-postgres
    plan: starter

# --- Managed Redis Key-Value Store ---
keyvalues:
  - name: vetlink-redis
    plan: starter
    ipAllowList: []